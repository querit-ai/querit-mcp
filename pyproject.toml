[project]
name = "querit-mcp"
version = "0.1.0"
description = "Hosted MCP server for Querit web search and content retrieval"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Querit" }]
keywords = ["querit", "mcp", "model-context-protocol", "search", "web-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp==2.0.0",
    "pydantic-settings>=2.14.2",
    "redis>=8.1.0",
    "uvicorn>=0.52.0",
]

[project.urls]
Homepage = "https://www.querit.ai"
Documentation = "https://www.querit.ai/en/docs/overview/quickstart"
Repository = "https://github.com/querit-ai/querit-mcp"
Issues = "https://github.com/querit-ai/querit-mcp/issues"

[project.scripts]
querit-mcp = "querit_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "hatchling>=1.31.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
